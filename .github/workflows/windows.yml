name: Windows Build

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: relese/Code

      - name: Build Windows release
        run: flutter build windows --release
        working-directory: relese/Code

      - name: Download VC++ Redistributable
        run: |
          curl -L -o vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        working-directory: relese/Code/installer

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" RosTabak.iss'
        working-directory: relese/Code/installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RosTabak-Setup
          path: relese/Code/installer/output/RosTabak-Setup.exe
